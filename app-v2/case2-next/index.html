<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101a2d">
  <title>法子と憲法くん V2 NEXT｜CASE 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section class="stage" id="stage">
      <div class="shade"></div>

      <header class="hud">
        <button id="homeBtn" class="icon-btn" aria-label="最初から">⌂</button>
        <div class="case-label"><small>CASE 02</small><strong>放課後、校則会議！</strong></div>
        <div class="growth" aria-label="法子の成長">
          <span class="growth-label">見習い</span>
          <div class="growth-track"><i id="growthBar"></i></div>
          <div id="skillIcons" class="skill-icons"><span class="on">👂</span><span>🔎</span><span>⚖️</span></div>
        </div>
        <button id="soundBtn" class="icon-btn" aria-label="音声切替">♪</button>
      </header>

      <div id="scene" class="scene"></div>
      <div id="reactionLayer" class="reaction-layer" aria-hidden="true"></div>

      <img id="noriko" class="noriko" src="../../images/noriko.webp" alt="見習い調査員の法子">

      <section id="panel" class="panel">
        <div class="speaker-row">
          <span id="speaker" class="speaker">憲法くん</span>
          <span id="stepLabel" class="step-label">事件導入</span>
        </div>
        <h1 id="headline">教室の声を、校則の改善につなげよう！</h1>
        <p id="message">今日は「髪どめの色」の校則をめぐって意見が割れている。正解を当てるのではなく、みんなの理由を聞いて、公平な案をつくる事件だよ。</p>
        <div id="content" class="content"></div>
        <div id="actions" class="actions">
          <button id="primaryBtn" class="primary">調査をはじめる</button>
        </div>
      </section>

      <aside class="class-meter" aria-label="教室の納得度">
        <span>教室の納得度</span>
        <div><i id="classBar"></i></div>
        <b id="classScore">0</b>
      </aside>
    </section>
  </main>

  <audio id="bgm" src="../../bgm_walk.mp3" loop preload="none"></audio>
  <audio id="seSelect" src="../se-select.mp3" preload="auto"></audio>
  <audio id="seMystery" src="../se-mystery.mp3" preload="auto"></audio>
  <audio id="seStamp" src="../se-stamp.mp3" preload="auto"></audio>
  <script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b35">
  <title>法子とけんぽうくんの事件簿 V2｜見習い編</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="v3.css">
</head>
<body>
  <main id="game" class="game-shell">
    <header class="hud">
      <button id="homeButton" class="hud-button">事件一覧</button>
      <div class="hud-title"><small id="caseNumber">V2｜見習い編</small><strong id="caseTitle">法子とけんぽうくんの事件簿</strong></div>
      <div id="progress" class="progress" aria-label="事件の進行"></div>
      <button id="soundButton" class="hud-button">音 ON</button>
    </header>
    <section id="stage" class="stage" data-case="0">
      <div class="backdrop"></div>
      <img id="noriko" class="character noriko" src="../images/noriko.webp" alt="法子">
      <img id="client" class="character client" src="../images/sadako.webp" alt="相談者">
      <img id="kenpo" class="character kenpo" src="../images/kenpoukun.webp" alt="けんぽうくん">
      <section id="screen" class="screen"></section>
    </section>
    <footer class="message-window" aria-live="polite"><b id="speaker">法子</b><p id="message">6つの事件を調査し、憲法の根拠で解決しよう。</p></footer>
  </main>
  <script src="questions.js"></script>
  <script src="audio.js"></script>
  <script src="game-v3.js"></script>
</body>
</html>
